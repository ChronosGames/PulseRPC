name: Game server validation

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-server-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  BASELINE_REF: 5ea04df00e1648eb53effdb0aba762f50cc01fca

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PULSERPC_TEST_REDIS: localhost:6379,abortConnect=false,connectTimeout=5000
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build and run correctness suites
        run: bash scripts/verify-game-server.sh
      - name: Verify workload and benchmark evidence cannot pass incomplete runs
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify test execution, including real Redis
        if: always()
        run: python3 scripts/summarize-game-server-tests.py artifacts/game-server/tests
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: game-server-correctness
          path: artifacts/game-server/
          retention-days: 14

  cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: game
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U game"
          --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      GAME_REDIS: localhost:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000
      GAME_POSTGRES: Host=localhost;Username=game;Password=acceptance-only;Database=game;Timeout=5;Command Timeout=5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build the game server persistence and cluster sample
        run: |
          dotnet build samples/GameServer/GameServer.Host/GameServer.Host.csproj -c Release --warnaserror
          dotnet build samples/GameServer/GameServer.LegacyClient/GameServer.LegacyClient.csproj -c Release --warnaserror
      - name: Build previous game server for actual mixed-version and rollback checks
        run: |
          git worktree add --detach "$RUNNER_TEMP/game-server-previous" d49a053e6b41bf6396536074e43521ea50478710
          dotnet build "$RUNNER_TEMP/game-server-previous/samples/GameServer/GameServer.Host/GameServer.Host.csproj" -c Release --warnaserror
          echo "GAME_PREVIOUS_HOST=$RUNNER_TEMP/game-server-previous/samples/GameServer/GameServer.Host/bin/Release/net10.0/GameServer.Host.dll" >> "$GITHUB_ENV"
      - name: Install TLS acceptance proxy
        run: sudo apt-get update -qq && sudo apt-get install -y stunnel4
      - name: Verify independent cluster processes through actual mTLS
        env:
          GAME_REDIS_CONTAINER: ${{ job.services.redis.id }}
          GAME_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          export GAME_JWT_KEY=$(openssl rand -base64 32)
          python3 scripts/verify-game-cluster.py
      - name: Show cluster diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('artifacts/game-server/cluster').glob('*.log'):
              print(path.name)
              print(path.read_text()[-12000:])
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: game-server-cluster
          path: artifacts/game-server/
          retention-days: 14

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Compare baseline and candidate on the same runner
        env:
          PULSERPC_CAPTURE_TRACE: '1'
        run: bash scripts/benchmark-game-server.sh "$BASELINE_REF" full
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: game-server-benchmark
          path: artifacts/game-server/
          retention-days: 14
