name: Game server validation

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-server-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  BASELINE_REF: 5ea04df00e1648eb53effdb0aba762f50cc01fca

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      PULSERPC_TEST_REDIS: localhost:6379,abortConnect=false,connectTimeout=5000
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'
      - name: Build and run correctness suites
        run: bash scripts/verify-game-server.sh
      - name: Verify test execution, including real Redis
        if: always()
        run: python3 scripts/summarize-game-server-tests.py artifacts/game-server/tests
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: game-server-correctness
          path: artifacts/game-server/
          retention-days: 14

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.100'
      - name: Compare baseline and candidate on the same runner
        run: bash scripts/benchmark-game-server.sh "$BASELINE_REF" smoke
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: game-server-benchmark
          path: artifacts/game-server/
          retention-days: 14
