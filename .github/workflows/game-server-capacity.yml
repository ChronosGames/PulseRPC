name: Controlled game server capacity

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 已有专用 Linux x64 Docker runner 标签（不创建或购买资源）
        required: true
        type: string
      profile:
        description: perf/game-server 下已提交的隔离验收配置，必须包含 SLO
        required: true
        default: perf/game-server/acceptance-soak.json
        type: string
      mode:
        description: 10–30 分钟 smoke 或单次连续 24 小时 soak
        type: choice
        options: [smoke, soak]
        default: soak
      smoke_seconds:
        description: smoke 持续秒数（600–1800），soak 忽略
        default: '600'
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-game-capacity-${{ inputs.runner_label }}
  cancel-in-progress: false

jobs:
  capacity:
    # Never execute pull-request or arbitrary branch code on a persistent runner.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, '${{ inputs.runner_label }}']
    timeout-minutes: 1560
    env:
      GAME_PROFILE: ${{ inputs.profile }}
      GAME_MODE: ${{ inputs.mode }}
      GAME_SMOKE_SECONDS: ${{ inputs.smoke_seconds }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 检查验收编排的失败路径
        run: python3 -m unittest discover -s scripts/tests -v
      - name: 部署隔离三节点并完成连续负载、采集和清理
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-game-acceptance.py --mode "$GAME_MODE" --profile "$GAME_PROFILE" \
            --duration "$GAME_SMOKE_SECONDS" --output-root "$RUNNER_TEMP/pulserpc-acceptance-evidence"
      # upload-artifact uses ACTIONS_RUNTIME_TOKEN, not the 24h GITHUB_TOKEN.
      # No GitHub API/git operations are performed after the long workload.
      - name: 取消或失败后重试本次隔离资源清理
        if: always() && steps.acceptance.outputs.artifact_path != ''
        env:
          EVIDENCE: ${{ steps.acceptance.outputs.artifact_path }}
        run: python3 scripts/cleanup-game-acceptance.py --output "$EVIDENCE"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: game-server-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.acceptance.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 90
      - name: 保留结果位置
        if: always()
        env:
          EVIDENCE: ${{ steps.acceptance.outputs.artifact_path }}
        run: |
          printf '验收证据保留在 runner：%s\n' "$EVIDENCE" >> "$GITHUB_STEP_SUMMARY"
          printf '单机隔离验收不是生产容量认证；只有完整证据通过才能确认本次长稳。\n' >> "$GITHUB_STEP_SUMMARY"
